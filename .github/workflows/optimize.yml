name: Weekly Re-Optimize

on:
  schedule:
    # Every Sunday 01:00 UTC (08:00 Thailand time)
    - cron: '0 1 * * 0'
  workflow_dispatch:  # manual trigger button

permissions:
  contents: write   # needed to commit params.json back to repo

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run optimizer
        env:
          SYMBOL: GLD
          TIMEFRAME: H1
          RISK_PER_TRADE_PCT: '1.0'
          MAX_DAILY_LOSS_PCT: '3.0'
          ALLOW_SHORTS: 'true'
        run: python optimize_gha.py

      - name: Commit updated params.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add params.json
          git diff --staged --quiet || git commit -m "chore: auto-update params $(date +%Y-%m-%d)"
          git pull --rebase
          git push
